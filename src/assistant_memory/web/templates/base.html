<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assistant Memory{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #ddd; padding-bottom: .5rem; }
    a.button, button { font: inherit; padding: .4rem .8rem; border: 1px solid #888; border-radius: .3rem; background: #f6f6f6; cursor: pointer; text-decoration: none; color: inherit; }
    .muted { color: #666; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
